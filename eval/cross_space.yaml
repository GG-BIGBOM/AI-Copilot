# 跨空间评测集（M19-A）——**M18 导入企业版语料的门禁**
#
# 量的不是「答得对不对」，是**「问的是这个 ERP 版本，材料会不会来自另一个版本」**。
# 旗舰版、客户端企业版、网页版企业版是三套不同的产品：同一个界面路径在三边
# 长得不一样，同一个数字在三边不是同一个数字。串了的表现**没有任何报错**——
# 答案照常有出处、照常通顺，用户照着点，单据做错了才发现。
#
# ⭐ **这一套题一道都不用判分器。** 拒答与否、召回了几块、块属于哪个空间，
# 全是规则判定。所以它永远不会 UNRELIABLE——这正是它能当门禁的原因：
# 判分器掉线的那天，别的评测都只能记 UNRELIABLE，而这一套照跑不误。
#
# 两组题缺一不可：
#
#   probe    在**还没导入语料**的企业版空间里，问旗舰版一定答得出的问题。
#            必须：一块都不召回、必须拒答、答案里不许出现旗舰版那个答案。
#
#   control  同样的问题在旗舰版里问一遍，必须答得出来。
#            ⚠️ **没有这一组，上面那组的"干净"证明不了任何事**——检索整个坏掉
#            （连不上 embedding、阈值配错、库是空的）时，probe 同样全绿。
#            对照组是用来区分「隔离成立」和「检索没工作」的唯一办法。
#
# 字段：
#   ask_in        在哪个知识版本里问（code，见 copilot/spaces.py）
#   expect        no_answer（探针）/ answer（对照）
#   banned        答案里出现即算污染（只写**别的空间才有**的具体事实）
#   source        期望命中的文档标题片段（只对照组用）
#   must_include  答案里必须出现的关键事实（只对照组用）
#   why           这题在测什么。别删

meta:
  corpus: 语雀 wdterpqjb（旗舰版ERP）4568 块；企业版两个空间尚无语料（M18 才导入）
  built_at: '2026-08-24'
  built_from: 题面直接取自 dataset.yaml 里已经验证过的事实题与操作题，
    这样对照组的"该答得出来"是有依据的，不是新编的

cases:
  # ======================= probe：空的企业版空间 =======================

  - id: cs-probe-desktop-jtsd
    ask_in: enterprise_desktop
    expect: no_answer
    q: 微信视频号的发货设置里，极兔快递对应的平台物流编码是什么？
    banned: ['JTSD']
    why: 旗舰版答得出的映射表格子。在客户端企业版里问，材料一块都不该有，
      答案里更不该出现 JTSD——出现了就说明空间过滤没拦住。

  - id: cs-probe-web-qimen
    ask_in: enterprise_web
    expect: no_answer
    q: 外部ERP分销商做奇门自助对接时，旺店通的 WMS AppKey 是多少？
    banned: ['23381383']
    why: 一个具体到位的数字，串过来一眼就看得见。换网页版企业版问，
      是为了让两个企业版空间各被探过一次——过滤器写死一个 id 的错误，
      只探一个空间是发现不了的。

  - id: cs-probe-desktop-stocktake
    ask_in: enterprise_desktop
    expect: no_answer
    q: 盘点的完整操作流程是怎样的？
    banned: ['盘点开单', '盘点录入']
    why: 操作类问题。这类题在旗舰版会带出截图——**图片是隔离最容易漏的一环**：
      正文拦住了，配图却从另一条路带出来的话，用户看到的是另一个产品的界面。
      这题一并验「配图必须是 0 张」。

  - id: cs-probe-web-print
    ask_in: enterprise_web
    expect: no_answer
    q: 发货单怎么打印？在哪个界面操作？
    banned: ['仓储-销售出库-单据处理']
    why: 界面路径是三套产品里最不可能相同的东西，也是错了代价最直接的东西
      （用户照着找不到那个菜单，或者更糟——找到了一个同名但不同义的菜单）。

  - id: cs-probe-desktop-general-guard
    ask_in: enterprise_desktop
    expect: no_answer
    q: 自动审核失败之后系统会重试几次？
    banned: ['10 次', '10次', '48']
    why: ⭐ 常识兜底开着时，「一条都没召回」不再直接返回兜底话术，而是**真的去问模型**
      （见 answer_all 的第一道闸门）。这题守的就是那条路：空空间 + 常识兜底，
      模型也不许把一个产品数字说出来。这是三条红线里「高风险幻觉」在空间维度的样子。

  # ======================= control：同样的问题在旗舰版 =======================
  #
  # ⚠️ 这一组要是掉了，上面那组的全绿**不作数**——报告会直接把这一轮判成
  # 「没量到」，而不是「通过」。

  - id: cs-control-flagship-jtsd
    ask_in: flagship
    expect: answer
    q: 微信视频号的发货设置里，极兔快递对应的平台物流编码是什么？
    source: 微信视频号电子面单
    must_include: ['JTSD']
    why: 对照：同一个问题在旗舰版必须答得出来。它证明检索这一轮是活着的。

  - id: cs-control-flagship-qimen
    ask_in: flagship
    expect: answer
    q: 外部ERP分销商做奇门自助对接时，旺店通的 WMS AppKey 是多少？
    source: 奇门分销
    must_include: ['23381383']
    why: 同上。两道对照分别对应两个探针，一一对上，缺一个都说明不了对应那条。

  - id: cs-control-flagship-stocktake
    ask_in: flagship
    expect: answer
    q: 盘点的完整操作流程是怎样的？
    source: 盘点流程
    must_include: ['盘点开单']
    why: 操作类的对照。它还顺带证明「探针那题的 0 张配图」是隔离的结果，
      而不是这一轮根本就没有图。
