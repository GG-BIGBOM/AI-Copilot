  - id: plat-remark-callback-platforms
    category: platform_specific
    q: 哪些平台支持把订单备注回传给平台？
    expect: grounded
    source: ['备注和回传策略', '各平台支持订单备注和标旗回传情况一览']
    must_include: ['快手']
    why: 原文：支持备注回传的平台为淘宝、京东、拼多多、抖音、阿里巴巴、快手。

      ⚠️⚠️ **原来的问法多问了一句「快手支持标旗回传吗」，那一句被删掉了——
      因为语料自己是矛盾的。** 2026-08-21 实测查证，两篇公共文档说的不是一回事：

          📒常见问题库 · 旗舰版功能常见问题及解决方案
              「快手平台支持回传备注不支持回传标旗」
          平台事项 · 各平台支持订单备注和标旗回传情况一览 · 七、快手
              「支持标旗回传，可回传灰色标旗」

      模型当时的表现其实是**这道题上最好的一种**：两条都答出来、点明它们冲突、
      说明自己按哪条走。判分器只看到其中一条，把它判成了 wrong。

      **语料自相矛盾的地方不能拿来当评测题**——它没有唯一正确答案，
      量出来的是判分器这一轮抽到了哪一篇，不是系统的能力。
      这条矛盾该走勘误层（`corrections` / `VerifiedAnswer`）定一个准，
      定谁需要业务判断，不是评测能决定的。**已记进 plan.md 的待办。**

