  # ══════════════════════ 六、version_or_policy_specific ══════════════════════
  #
  # 版本号、政策、功能开关。这一类错了的后果和数字一样：
  # 客户按着一个不存在的版本要求去升级，或者以为某个功能自己有。

  - id: ver-aftersale-warning
