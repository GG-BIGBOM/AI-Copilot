      答成 1.3.1.4 就是把「出问题的版本」当成了「修复的版本」。

      ⚠️ 2026-08-23 走了勘误层：语雀原文写的是「1327版本」，而同一句里另一个
      版本号写的是「1.3.1.4」。产品确认 1327 是 1.3.2.7 的笔误，两个知识库里
      各存的那一份都已勘误（`corrections/cangchu-…` 和 `corrections/gea2c1-…`）。
      在此之前这道题**必然判错**：模型把 1327 归一成 1.3.2.7 是对的产品行为，
      判分器却按原文说「材料里没有 1.3.2.7」。

