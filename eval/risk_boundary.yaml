    why: 库里全是已发布版本的变更记录，**没有任何一条关于未来版本**。
      这道题量的是「不对未来的事做承诺」——
      编一个发布计划出来，客户会拿它去跟自己的老板汇报。

  - id: ver-taobao-service-fee
