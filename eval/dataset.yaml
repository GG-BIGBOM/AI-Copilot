# 知识库 Agent 评测集
#
# ⚠️ **每一道题的答案都是从真实语料里抄出来的**，不是凭想象编的。
# 编题的做法：先把 5268 个块里「带界面路径、带数字、带映射表」的挑出来读，
# 再针对读到的具体事实出题。凭想象出的题会让指标好看却毫无意义——
# 模型答对的是我脑子里的知识库，不是磁盘上这个。
#
# 语料：语雀 wdterpqjb（旗舰版ERP）14 个库 / 746 篇 / 5268 块，2026-08-17 快照
#
# 四类题，各自量的是不同的东西：
#   fact       材料里有明确答案 → 要答对、要引对源。量**准确率**
#   no_answer  材料里没有       → 必须说「知识库暂无此内容」。量**幻觉率**
#   probe      材料里有，但问法偏/绕 → 也该答出来。量**假阴性率**
#              （M6 验收时撞见的：材料里就是答案，却被答成「不知道」）
#   partial    材料只覆盖一部分 → 答已有部分 + 明确说哪部分没有
#
# 字段：
#   q             问题
#   source        期望命中的文档标题里应含的字串（判「检索对不对」，与「答得对不对」分开）
#   must_include  答案里必须出现的关键事实（判定不区分大小写；数字/编码类要原样）
#   must_not_include  出现即算错（一般用于挡「换个说法把不知道说成知道」）
#   why           这题在测什么。**别删**——半年后回来看，没有这行就不知道当初为什么出这道题
#   hard          难题标记。M8 那 41 题在 v3 上饱和到 100%，饱和的题集**只能发现退化、
#                 不能证明改进**——任何改动都显示「没变化」。2026-08-18 补了这批
#                 需要跨块/跨文档/否定推理的题，专门用来把天花板顶开
#   scope         public（默认，打公共库）/ private（打某个用户的私有库，
#                 要配合 `--as-user <邮箱>` 跑，见 eval/private/README.md）

meta:
  corpus: 语雀 wdterpqjb 14 个库 / 746 篇 / 4568 块（M8 清掉 700 块二进制垃圾后）
  built_at: '2026-08-17'
  built_from: 人工阅读 1178 个「含界面路径且长于 220 字」的块后出题
  # 2026-08-18 第二批：14 道难题。出题方式和第一批一样是**先读语料再出题**——
  # 每条事实都用 SQL 在 chunks 里核实过原文，包括 no_answer 那几道的「确实没有」。
  # 判分器同时从 deepseek-reasoner 换成 gemini-2.5-pro（换厂，解决同源偏心）
  revised_at: '2026-08-18'

cases:
  # ======================= fact：有明确答案 =======================

  - id: fact-logistics-code-jtsd
    kind: fact
    q: 微信视频号的发货设置里，极兔快递对应的平台物流编码是什么？
    source: 微信视频号电子面单
    must_include: ['JTSD']
    why: 映射表里的单个格子。这类问题最能暴露「表格被拍平成一坨」——
      表格结构没了的话，模型会把编码和快递公司配错。

  - id: fact-logistics-code-yunda
    kind: fact
    q: 微信视频号物流映射里韵达的平台编码是什么？
    source: 微信视频号电子面单
    must_include: ['YUNDA']
    why: 同上换一行。两行都对才能说明表格的行对应关系保住了。

  - id: fact-qimen-appkey
    kind: fact
    q: 外部ERP分销商做奇门自助对接时，旺店通的 WMS AppKey 是多少？
    source: 奇门分销
    must_include: ['23381383']
    why: 一串纯数字。模型最容易在这种地方「顺手改一位」，而这种错在生产环境
      是直接对接失败。

  - id: fact-batch-exchange-limit
    kind: fact
    q: 订单审核界面的批量换货，一次最多能操作多少单？
    source: 订单审核界面换货说明
    must_include: ['500']
    why: 有明确上限的操作。答不出数字或答了别的数字都算错。

  - id: fact-xianyu-url
    kind: fact
    q: 对接闲鱼平台时，闲鱼管家的后台地址是什么？要选哪种模式？
    source: 闲鱼平台对接
    must_include: ['goofish.pro', '第三方']
    why: URL + 一个选项。URL 是最容易被模型「补全」成看起来合理但错误的形式的。

  - id: fact-xhs-sender-path
    kind: fact
    q: 1.3.9.7 及以上版本，小红书面单的寄件人信息在哪里维护？
    source: 小红书面单模板
    must_include: ['打印设置', '第三方打印', '寄件人']
    why: 界面路径要原样保留。路径答错等于让实施顾问在系统里瞎找。

  - id: fact-xhs-sender-priority
    kind: fact
    q: 小红书面单的寄件人信息，全局配置和按物流配置哪个优先级更高？
    source: 小红书面单模板
    must_include: ['按物流']
    why: 优先级这种「二选一」的结论，模型有五成概率靠猜也对——
      所以配了下面 must_not_include 的反例题一起看。

  - id: fact-stopzone-import-overwrites
    kind: fact
    q: 物流停发区域用 Excel 导入时，会追加还是覆盖原有设置？
    source: 物流停发区域
    must_include: ['覆盖']
    why: ⭐ 这是「答错代价最大」的一类：答成追加，客户导完发现全丢了。
      材料里专门写了警告，模型该把警告带出来。

  - id: fact-stopzone-copy-count
    kind: fact
    q: 物流停发区域的复制功能，一次能复制给几个物流公司？
    source: 物流停发区域
    must_include: ['一个']
    why: 材料明确写「目前只能复制给一个物流」。答「多个」是幻觉。

  - id: fact-taobao-hold-24h
    kind: fact
    q: 淘宝百亿补贴的订单最长会 hold 单多久？
    source: 物流同步常见报错
    must_include: ['24']
    why: 常见问题库里的一个具体时长。客服场景下问得最多的就是这种。

  - id: fact-bom-batch-times
    kind: fact
    q: 批量引用物料单保存之后，总生产次数会被算成几次？
    source: 物料清单
    must_include: ['1']
    why: 一个反直觉的行为（填了多次也算 1 次）。材料里是「注意」段，
      模型若靠常识推理一定答错——正好测「只用材料、不用常识」这条铁律。

  - id: fact-production-import-required
    kind: fact
    q: 生产单批量导入时，哪些字段是必填的？
    source: 分步生产
    must_include: ['清单编号', '生产员', '生产方式', '生产次数', '生产商']
    why: 多项枚举。测的是「答全」而不只是「答对一个」。

  - id: fact-production-cost-default
    kind: fact
    q: 生产单导入时生产费用合计不填，系统默认取什么值？
    source: 分步生产
    must_include: ['物料清单', '生产次数']
    why: 一个计算式。模型容易只说「默认为空」。

  - id: fact-fx-price-mapping
    kind: fact
    q: 分销端从供销商复制货品到货品档案时，供销端的「分销价」对应分销端的哪个价格？
    source: 分销商品维护
    must_include: ['最低价']
    why: 三组价格的对应关系，错一组就是全盘错。这类映射是纯记忆题，
      没有任何常识可依赖。

  - id: fact-fx-retail-zero
    kind: fact
    q: 如果供销端没有开启基础价，分销端复制过来的零售价默认是多少？
    source: 分销商品维护
    must_include: ['0']
    why: 边界值。「默认为 0」这种细节最容易被概括掉。

  - id: fact-print-batch-format
    kind: fact
    q: 打印批次序号按物流类型排序后，序号的命名规则是什么？PC 端显示完整序号吗？
    source: 销售出库打印
    must_include: ['x-n']
    must_not_include: []
    why: 规则 + 一个例外（PC 端只显示 x）。测「材料里的限制条件要保留」。

  - id: fact-combo-ratio-schedule
    kind: fact
    q: 组合装金额占比支持自动执行吗？什么时候执行？
    source: 组合装管理
    must_include: ['凌晨']
    why: 有/没有 + 时点。这类「系统什么时候自己动」的问题客户问得很多。

  - id: fact-app-order-window
    kind: fact
    q: 旺店助手 APP 的「我的订单」里，订单能显示多长时间？
    source: APP · 我的订单
    must_include: ['480']
    why: 一个非整天的小时数（480 小时），模型极易换算成「20 天」——
      换算本身没错，但材料写的是 480 小时，改写就说明它在加工而不是引用。

  - id: fact-app-query-limit
    kind: fact
    q: 旺店助手 APP 批量查询单号，一次上限是多少条？
    source: APP · 我的订单
    must_include: ['500']
    why: 与 PC 端一致的上限，材料里有明确报错话术。

  - id: fact-purchase-price-time
    kind: fact
    q: 配置采购价执行时间时，开始执行时间可以填今天以前的日期吗？
    source: 配置采购执行时间
    must_include: ['不能']
    why: 校验规则。答「可以」会让客户配出一个永不生效的价格。

  - id: fact-purchase-price-one
    kind: fact
    q: 一个供应商货品能同时维护几个采购价执行时间？
    source: 配置采购执行时间
    must_include: ['一个']
    why: 同上文档的另一条约束，验「同一篇里的多个细节都取得到」。

  - id: fact-reconcile-shipping-amount
    kind: fact
    q: 平台对账里的「发货金额」包含哪些部分？
    source: 平台对账
    must_include: ['货品', '邮费']
    why: 财务字段定义。少说一项（漏了邮费）在对账场景就是差额对不上。

  - id: fact-affair-sms-config
    kind: fact
    q: 想让事务新建后短信提醒责任人，需要在哪里开配置？
    source: 新建事务
    must_include: ['事务设置']
    why: 「要做某事该开哪个开关」——实施顾问最高频的问法。

  - id: fact-secure-login-policies
    kind: fact
    q: 安全登录提供了几种登录 IP 限制策略？
    source: 安全登录
    must_include: ['四']
    why: 计数题。模型倾向于把枚举数错，且数错时语气一样自信。

  - id: fact-jd-waybill-template
    kind: fact
    q: 京东电子面单模板怎么设置？
    source: 京东面单模板
    must_include: []
    why: ⭐ M5 上线验收用的那道题（当时数据没灌完答不上来）。留在评测集里当
      回归哨兵：它一旦退化，说明面单这条最常问的主线出了问题。
      不设 must_include——这题看的是「有没有引对源、有没有编造系统内路径」。
      ⚠️ source 起初写成「京东」，结果匹配上了「京东沧海使用手册」——
      期望来源写太松，等于把「检索错了」判成对。必须写到能唯一指认那一篇。

  - id: fact-jd-wdt-side-steps
    kind: fact
    q: 京东云模板下载到旺店通之后，怎么和系统里的物流建立对应关系？
    source: 京东面单模板
    must_include: ['模板类型', '物流']
    why: ⭐ **这道题是 M8 最重要的发现留下的。**
      M5 上线验收时问「京东电子面单模板怎么设置」，答案末尾诚实地补了一句
      「材料中未提供旺店通系统内的具体设置步骤」，当时被当成防幻觉做得好的证据。
      M8 建评测集时才查出来：那篇文档**第 7 块（共 7 块）就是**
      「3.旺店通erp操作 › 3.1 下载京东云模板 / 3.2 配置 / 3.3 使用」——
      知识库里一直有。模型没说谎，它对着自己拿到的上下文说的是实话；
      **是重排 top-5 没把第 7 块捞上来。**
      所以那句「诚实」其实盖住了一次召回失败——
      这类失败没有评测集是发现不了的，因为答案读起来完全合理。
      这道题专门盯这一块：答案要出现「模板类型」和「物流」（原文是
      「依次选择模板类型和物流，点击保存」）。

  # ======================= no_answer：材料里没有 =======================
  # ⚠️ 这几道题上线前逐条验过：拿它们去检索，没有任何一块沾边。
  #    出这类题最大的风险是**自己搞错**——万一知识库里其实有，
  #    那模型答出来反而被判成幻觉，指标就整个歪了。

  - id: none-annual-meeting
    kind: no_answer
    q: 公司今年的年会在哪里开？
    must_include: []
    why: 与 ERP 毫无关系的问题。最基本的兜底。

  - id: none-stock-code
    kind: no_answer
    q: 旺店通的母公司慧策的股票代码是多少？
    why: 听起来「像是该知道」的公司信息。模型的预训练知识里可能真有，
      正好测「只用材料，不用自己的常识」。

  - id: none-payroll
    kind: no_answer
    q: 怎么在旺店通里给员工发工资条？
    why: ⭐ 最危险的一类：**听起来完全像个 ERP 功能**，但这套系统没有。
      模型很容易照着「员工权限」「薪资」的相邻概念编出一套操作路径来。

  - id: none-price-usd
    kind: no_answer
    q: 旗舰版 ERP 的年费是多少美元？
    why: 商务信息，材料里只有功能文档。数字类幻觉的代价最高。

  - id: none-sap-connector
    kind: no_answer
    q: 旺店通和 SAP 的标准对接方案是怎样的？
    why: 平台对接文档很多（闲鱼/抖店/1688…），SAP 恰好没有。
      测的是「相邻主题很丰富时，能不能守住『这一个没有』」。

  - id: none-mysql-backup
    kind: no_answer
    q: 旗舰版 ERP 的数据库是 MySQL 还是 SQL Server，怎么手动备份？
    why: 技术架构问题。文档是给实施顾问看的，不涉及底层。

  - id: none-shopify
    kind: no_answer
    q: Shopify 店铺怎么对接旺店通？
    why: 同 SAP，但换成一个更常被问的海外平台。

  - id: none-hr-attendance
    kind: no_answer
    q: 系统里怎么做仓库人员的考勤打卡？
    why: 有「上架员绩效」这类相邻文档，但考勤打卡没有。
      测「相邻但不相同」时会不会硬凑。

  # ======================= probe：材料里有，但问法偏 =======================
  # M6 验收时撞见的那类：检索明明把答案排在第一，模型仍答「知识库暂无此内容」。
  # 这几道题量的是**假阴性**——太保守的代价。

  - id: probe-colloquial-waybill
    kind: probe
    q: 面单老是打歪，往上跑，这个偏移量在哪儿调啊？
    source: 打印偏移
    must_include: []
    why: 口语化 + 带情绪的问法，和文档措辞完全不重合。真实用户就是这么问的。

  - id: probe-vague-stopzone
    kind: probe
    q: 有些偏远地区快递根本到不了，能不能在系统里按省市区限制这些地方不允许发货？
    source: 停发区域
    why: 用户不知道「停发区域」这个术语，只会描述现象。
      第一版问的是「能提前拦住吗」，检索命中的是「物流拦截功能」——
      那其实也算对，是**我的题出得含糊**，不是检索错。改成带「按省市区」的问法，
      才唯一指向停发区域。**这一条本身就是评测集要反复校准的例子**：
      期望来源写窄了，量到的是自己出题的准头，不是系统的。

  - id: probe-why-split-failed
    kind: probe
    q: 一键拆分点了没反应，提示来源非平台抓单，是什么意思？
    source: 拆分
    why: 直接贴报错话术来问——客服场景最真实的输入形态。

  - id: probe-negation-form
    kind: probe
    q: 组合装是不是不能拆分？
    source: 拆分
    why: ⭐ 否定式提问。材料说的是「只支持打印方式为组合装明细的组合装拆分」，
      正确答法是「有条件地能」。模型容易被否定句带着答「是的不能」。

  - id: probe-two-hop
    kind: probe
    q: 我想让某个物流的寄件人跟别的物流不一样，可以吗？
    # source 可以给多个：好几篇文档都能正当地回答同一个问题，
    # 只认一篇就把「检索对了但不是我预设那篇」误判成失败
    source: [寄件人, 发件人]
    why: 需要从「按物流配置」这个功能反推出「可以」。多一跳推理，
      但答案完全在材料里。

  # ======================= partial：只覆盖一部分 =======================

  - id: partial-sms-template
    kind: partial
    q: 营销短信的模板在哪里建？短信费用怎么收？
    source: 营销管理
    why: 前半段材料里有（设置–策略设置–短信策略），后半段（计费）没有。
      正确答法是答前半段 + 明说后半段没有。

  - id: partial-combo-auto-create
    kind: partial
    q: 平台货品编码带【】前后缀时能自动建组合装吗？失败了会怎样？
    source: 组合装
    why: 材料写了触发条件和「匹配失败则递交失败」，但没写失败后如何补救。
      测「答已有的、点明缺的」这条铁律。

  # ======================= 第二批：难题（2026-08-18）=======================
  #
  # 为什么要有这一批：v3 在原来 41 题上是 100%，**天花板到了**。
  # 一个饱和的题集只能证明「没退化」，任何改进都显示为 0。
  # 这 14 道专攻四种原来没覆盖的能力：
  #   多跳    答案要拼两处材料，缺一处就答不全
  #   跨文档  两篇文档各有一半
  #   否定    材料里写的是「不支持/不能」，要照实说不能，而不是找个近似的说能
  #   条件    材料里是「一般不行，但满足某条件可以」，只答一半就是错
  #
  # 前三种最容易出的错是**含混地答对一半**——判分器看得出来，人扫一眼看不出来。

  - id: hard-multi-gift-window-and-cap
    kind: fact
    hard: true
    q: 赠品策略按历史订单计算时，可以往前查多少天？符合条件的订单又最多取几笔参与计算？
    source: 赠品流程解析
    must_include: ['64', '50']
    why: 多跳。两个数字都在 1.4.8.6 版本更新那一段里，但分属两条并列说明。
      只答 64 天不答 50 笔，读起来完全通顺——这正是「含混答对一半」的典型。

  - id: hard-multi-logistics-quota-version-and-path
    kind: fact
    hard: true
    q: 物流类型单量限制这个功能要升级到哪个版本才有？在哪个菜单路径下配置？
    source: 物流单量限制
    must_include: ['1.5.8.6', '物流策略']
    why: 多跳。版本号在文档开头的加粗提示里，路径在功能说明的第 1 条。
      版本号这类信息模型很容易略过不说，因为不说也像个完整答案。

  - id: hard-negation-feishu-at-member
    kind: fact
    hard: true
    q: 飞书群的消息通知能 @ 到指定的某个员工吗？
    source: 消息通知
    must_include: ['不支持']
    must_not_include: ['可以@指定', '支持指定员工']
    why: 否定推理。同一篇文档花了大篇幅讲钉钉/企业微信怎么 @ 到具体人，
      只有最后一句说飞书不支持。模型极容易把前面的通用步骤套到飞书上答「可以」。

  - id: hard-negation-manual-order-tiered-gift
    kind: fact
    hard: true
    q: 手工建单的订单能参与阶梯满赠的策略试算吗？
    source: 阶梯满赠
    must_include: ['不支持']
    why: 否定推理。这条藏在「排查步骤」列表的第 2 条里，
      而整篇文档都在讲怎么配置阶梯满赠——上下文全是「能」，只有这一句是「不能」。

  - id: hard-negation-anchor-role-auto-create
    kind: fact
    hard: true
    q: 主播绩效里的助播、场控、运营这几个角色，系统会自动创建吗？
    source: 主播绩效
    must_include: ['手动']
    why: 否定推理 + 实体区分。同一篇里「主播」是可以自动创建的，
      只有助播/场控/运营不行。答错的典型方式是把主播那条规则套到全部角色上。

  - id: hard-conditional-purchase-audit-override
    kind: fact
    hard: true
    q: 勾选了「阻止采购价大于上次采购价通过审核」之后，采购价超了就一定审核不过吗？
    source: 采购单审核
    must_include: ['强制审核']
    why: 条件推理。材料原文是「无法通过审核，强制审核可通过」——
      只读前半句会答「过不了」，那是错的；而这个错误读起来非常合理。

  - id: hard-crossdoc-limit-100-both
    kind: fact
    hard: true
    q: 自定义属性和计量单位的辅助单位，各自最多能添加多少个？
    source: 计量单位
    must_include: ['100']
    why: 跨文档。两个上限分别写在《自定义属性》和《计量单位》两篇里，
      数值恰好都是 100——所以这题真正考的是**有没有同时找到两篇**，
      而不是记住一个数。只召回一篇也能答出 100，判分器要看它有没有覆盖两者。

  - id: hard-numeric-combo-refresh-cap
    kind: fact
    hard: true
    q: 组合装右键刷新固定售价和金额占比，一次最多能操作多少条？
    source: 货品设置
    must_include: ['3000']
    why: 单点数字，但埋在一个很长的括号注释里（「（单次最多操作3000条）」）。
      M8 查出的召回失败就是这种形态：事实在块的中段，重排容易把它排下去。

  - id: hard-numeric-guobu-cap
    kind: fact
    hard: true
    q: 国补政策里，每位消费者每类产品能补贴几件？每件的补贴上限是多少钱？
    source: 国补
    must_include: ['1', '2000']
    why: 多跳 + 两个量纲不同的数字（件数、金额）。
      只答金额不答件数是最常见的半对。

  - id: hard-version-douyin-shared-waybill
    kind: fact
    hard: true
    q: 1.3.1.4 版本能用抖音电子面单的多店铺共享面单功能吗？如果不能有什么替代办法？
    source: 获取单号常见报错
    must_include: ['不支持']
    why: 否定 + 追加要求（替代方案）。材料里两句话紧挨着：不支持，
      建议先用线下热敏物流或给每个店铺新建物流。
      只答「不支持」就丢了用户真正要的那一半。

  - id: hard-probe-quota-refresh
    kind: probe
    hard: true
    q: 给顺丰配的每日单量用完了，第二天还要手动去调一次吗？
    source: 物流单量限制
    must_include: ['刷新']
    why: 问法完全是用户口吻，材料里的说法是「每日0点刷新成每日最多消耗单量」，
      字面没有「手动」「第二天」。考的是能不能把场景翻译成材料里的术语。

  - id: hard-probe-one-strategy-per-logistics
    kind: probe
    hard: true
    q: 同一个快递公司想配两条不同的单量限制策略，能配吗？
    source: 物流单量限制
    must_include: ['一条']
    why: 否定 + 转述。材料写的是「每个物流类型只能有一条策略」，
      而问题用的是「快递公司」「两条」。同义转换 + 否定，双重难度。

  - id: hard-noanswer-tiktok
    kind: no_answer
    hard: true
    q: TikTok 小店的电子面单模板要怎么在旗舰版 ERP 里配置？
    why: 语料里有抖音、京东、快手、美团、拼多多、唯品会 MP 六个平台的面单模板文档，
      **唯独没有 TikTok**（SQL 核实：0 块）。这题专门测「邻近主题拉不拉得住」——
      六篇高度相似的文档就在旁边，模型很容易照着抖音那篇编一份 TikTok 的步骤出来。

  - id: hard-noanswer-lazada
    kind: no_answer
    hard: true
    q: Lazada 店铺的订单怎么同步到 ERP？
    why: 同上，Lazada 在语料里是 0 块。但「速卖通」有 14 块——
      跨境平台这个语义邻域是**存在**的，所以这题比问一个完全无关的词更难。

  # ======================= 私有库（scope: private）=======================
  #
  # 这组题**不和上面 55 题一起跑**，要 `--as-user <邮箱>`，见 eval/private/README.md。
  # 度量的是 M8 明确列为缺口的那件事：私有库的检索质量从来没被量过。
  #
  # 夹具里每个数字都刻意和语雀语料不重合（语料里没有"星辰电商"）。
  # 所以答对 = 私有文档真的在混合检索池里冒了头；答成公共库里某个相近的数字
  # = 私有文档被挤掉了。这是这组题唯一的判据。

  - id: priv-fact-zhongtong-cap
    kind: fact
    scope: private
    q: 星辰电商给中通配的日单量上限是多少？
    source: 客户A-实施配置约定
    must_include: ['800']
    why: 最基本的一条：私有文档能不能被检索到。
      注意语料里另有一篇《物流单量限制》讲顺丰 1000 单——
      答成 1000 就是私有文档被公共库挤掉了，这个错误极具迷惑性。

  - id: priv-fact-warehouse-scope
    kind: fact
    scope: private
    q: 星辰电商的华南备货仓负责发哪些省份？
    source: 客户A-实施配置约定
    must_include: ['广东', '广西', '海南']
    why: 三项并列，考的是块没被从中间切断。

  - id: priv-negation-combo-split
    kind: fact
    scope: private
    q: 星辰电商的组合装订单需要拆分吗？
    source: 客户A-实施配置约定
    must_include: ['不']
    why: 否定 + 强干扰。公共库里《流程中拆分条件说明》整篇都在讲怎么拆组合装，
      语义上和这个问题贴得极近。模型很容易拿公共库那篇来回答一个私有约定。

  - id: priv-multi-reconciliation
    kind: fact
    scope: private
    q: 星辰电商的对账以什么为准？多大的差异需要人工复核？
    source: 客户A-实施配置约定
    must_include: ['平台结算单', '500']
    why: 多跳，两个事实在同一节的两句话里。

  - id: priv-noanswer-not-in-fixture
    kind: no_answer
    scope: private
    q: 星辰电商的退货入库要走哪几个审核节点？
    why: ⭐ 夹具里**没有**退货流程。但公共库里退货入库的文档一大把——
      所以这题在测「会不会拿公共库的通用流程冒充这家客户的专属约定」。
      这是私有库场景下最危险的一种幻觉：答案看着专业、其实和这家客户无关。

  - id: priv-probe-inventory-line
    kind: probe
    scope: private
    q: 星辰的 SKU 库存低到多少会在采购建议里飘红？
    source: 客户A-实施配置约定
    must_include: ['20']
    why: 口语化问法（"飘红"是原文用词，但"低到多少"不是），
      且答案是个很小的数字，容易和文档里其他数字（8 号、3 号）混淆。

  # ======================= procedural：多步操作，答案该带截图 =======================
  #
  # ⚠️ **这批题是补一个盲区，不是锦上添花。**
  # 原来 55 题里只有 1 道是「怎么操作」类的——其余全是事实查询
  # （「极兔的平台编码是什么」这种，一句话答完，配图本来就不合适）。
  # 于是「答案该带截图却没带」这类退化，在全部现有指标上都是隐形的。
  # 线上反馈的「回答没有图片了」就是这么漏过去的。
  #
  # `procedural: true` 是「配图带出率」这个指标的分母。别拿问题里的关键词去猜——
  # 猜出来的分母会随着有人换个问法而变，指标就没法跨轮比了。
  #
  # 每条事实都用 SQL 在 chunks 里核实过原文（2026-08-18）。

  - id: proc-stocktake-flow
    kind: fact
    procedural: true
    q: 盘点的完整操作流程是怎样的？
    source: 盘点流程
    must_include: ['盘点开单', '盘点录入']
    why: 一条跨块的完整流程。**流程图和各步骤的截图分散在不同块里**，
      正是「命中了正确文档、却命中了没有截图的那一块」的典型。

  - id: proc-stocktake-schemes
    kind: fact
    procedural: true
    q: 盘点开单的时候可以选哪几种盘点方案？
    source: 盘点流程
    must_include: ['明细', '货位', '单品']
    why: 三个维度写在同一句里，但这一块的截图在它后面。
      答对不难，难的是把那一步对应的截图一起带出来。

  - id: proc-purchase-return-flow
    kind: fact
    procedural: true
    q: 采购退货的操作流程是什么？
    source: 采购退货流程
    must_include: ['采购退货开单', '采购退货结算']
    why: 三段式流程（开单→出库→结算）横跨好几块，每块各带自己的截图。
      这题同时在测「跨块流程答不答得全」和「截图跟不跟得上」。

  - id: proc-purchase-return-outbound
    kind: fact
    procedural: true
    q: 采购退货出库有哪两种方法？
    source: 采购退货流程
    must_include: ['快速出库']
    why: 「分步」和「快速」两种方法分别写在相邻的两块里——
      只命中一块就只能答出一半。

  - id: proc-print-delivery-note
    kind: fact
    procedural: true
    q: 发货单怎么打印？在哪个界面操作？
    source: 系统打印模板设置及打印位置
    must_include: ['仓储-销售出库-单据处理']
    why: 界面路径要原样答出来。这篇每一块都很短且每块带一张图，
      是检验「短块 + 图」这种形态的好例子。

  - id: proc-print-picking-wave
    kind: fact
    procedural: true
    q: 打印分拣波次在哪里操作？
    source: 系统打印模板设置及打印位置
    must_include: ['仓储-销售出库-单据处理']
    why: 和上一题同一篇的邻块。两题都问出来，说明相邻块没有互相盖掉。
