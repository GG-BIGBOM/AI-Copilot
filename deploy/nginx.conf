# liushun666.cn —— 知识库 Agent + 保留 Aura Note
#
# 装到 /etc/nginx/sites-available/copilot 并软链到 sites-enabled/，
# 同时把原来的 aura 软链删掉（它的 server 块被这份取代了）。
# 证书行由 certbot 生成，续期时它还会来改这个文件，别手写死路径。
#
# location 的顺序不影响匹配（nginx 按前缀长度择优），但按下面这个顺序读最清楚。

server {
    server_name liushun666.cn www.liushun666.cn;

    # 前端是 Next.js 静态导出的产物
    root /var/www/copilot;
    index index.html;

    # M6 要传 20MB 的文档。默认 1m，不改的话上传直接 413，
    # 而且报错发生在 nginx，应用日志里什么都看不到。
    #
    # ⭐ 故意比应用的上限（`upload_max_bytes` = 20MB）**宽一点**：
    # multipart 的分隔符和头也算进 body 长度，正好卡 20m 会让一个 19.9MB 的
    # 文件被 nginx 拦下，而 nginx 回的是一页 HTML，前端拿不到那句
    # 「文件超过 20MB 上限」，只能显示一句含糊的兜底话术。
    # 让应用自己去拦，报错才说得清。
    client_max_body_size 21m;

    # ---------- 语雀配图 ----------
    # 约 1.7 万张、近 3GB。**必须由 nginx 直接发**：FastAPI 里那个
    # app.mount("/images") 只是本地开发用的，1.6GB 的机器上让 Python
    # 发几万张图纯属浪费。
    # 注意 alias 结尾的斜杠不能少，否则路径会拼错。
    location /images/ {
        alias /opt/copilot/data/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---------- API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⭐ SSE 的生死线。nginx 默认会缓冲上游响应，
        # 结果就是用户盯着空白等十几秒、然后整段答案一次性蹦出来——
        # 流式白做了，而且这故障看起来像"模型很慢"，极难联想到是反代配置。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        # 一次长回答可能生成一两分钟，默认 60s 会把连接掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Aura Note 已于 2026-08-17 下线（用户决定只保留知识库助手）。
    # 站点文件归档在服务器 /root/backup-20260817-163500/var-www/myprogram（186M），
    # 要恢复的话把文件放回 /var/www/myprogram 并加回一个 location /aura/ 即可。

    # ---------- 前端 ----------
    # 静态导出 + trailingSlash: true，每个路由是 out/<route>/index.html。
    # 兜底到 /index.html 是为了客户端路由：直接访问 /chat/ 也要能出页面。
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/liushun666.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/liushun666.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.liushun666.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = liushun666.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name liushun666.cn www.liushun666.cn;
    return 404; # managed by Certbot
}
