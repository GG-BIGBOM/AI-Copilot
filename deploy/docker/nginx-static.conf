# 发前端静态产物（W1.3，只给本地 compose 用）。
# 线上那份是 deploy/nginx.conf——那个还要反代 /api、发图片、配 TLS，
# 这份只做一件事：把 out/ 发出去。

server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ⚠️ `trailingSlash: true` 的静态导出把每个路由写成 `<route>/index.html`
    # （见 frontend/next.config.ts）。所以先试目录，再兜底到首页——
    # 少了 `$uri/` 那一段，刷新任何一个子页面都会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存；HTML 不行，否则改了页面刷新也看不到
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
