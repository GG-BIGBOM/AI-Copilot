# 和 deploy.sh 第 1 步（本机自检）跑的是同一批命令。
# 两边任何一处改了检查项，另一处也要改——否则会出现「CI 绿、部署红」。
#
# ⚠️ 这里**不跑评测**。`eval/run.py --check` 要打 SiliconFlow 的 embedding
# 接口、还要库里有语料，两样 CI 都没有。评测始终在本机跑，见 EVALUATION.md。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支上后推的 commit 顶掉前一次还没跑完的
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        # ⭐ 必须是 pgvector 的镜像，不能用官方 postgres:16。
        # 初始迁移里有 `CREATE EXTENSION IF NOT EXISTS vector`，
        # 镜像里没装扩展的话这一句直接失败，而报错长得像迁移写错了
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb
          POSTGRES_DB: kb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://kb:kb@localhost:5432/kb
      # 测试要能签发登录态。这是 CI 里的一次性值，和线上无关
      JWT_SECRET: ci-only-not-a-real-secret
      # 三方密钥一个都不给：测试全程用 chat_helpers.py 里的假 provider。
      # 哪天有用例真去连网络，它会在这里当场变红——这正是要的

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # ⚠️ **别用 `uv sync --all-extras`**：它会连 parse-full 一起装，
      # 那个 extra 带的是 docling → torch，几个 G，CI 上纯粹是浪费。
      # 这五个 extra 才是测试真正 import 的：
      #   parse  → docx / pptx / pypdf     agent → pydantic_ai     eval → yaml
      #   hybrid → jieba（W1.2）           obs   → opentelemetry（W1.1）
      #
      # ⚠️ hybrid 和 obs **必须装**，否则 `test_hybrid.py` 会整片 skip、
      # `test_obs.py` 会走 importorskip——两份都变成"绿的，但什么都没验"。
      # 混合检索改的是检索，而检索是这个项目里唯一一处"改了会让答案变、
      # 但不会报错"的地方；它的隔离断言正是最不能悄悄跳过的那几条。
      # 下面 pytest 的 `-rs` 就是为了让这种跳过在 CI 日志里藏不住
      - name: 装依赖
        working-directory: backend
        run: uv sync --extra parse --extra agent --extra eval --extra hybrid --extra obs

      # ⚠️ **下面一律直接调 `.venv/bin/...`，不用 `uv run`**（deploy.sh 里
      # 同样的坑，2026-08-23 踩过）。`uv run` 会先把环境同步回 pyproject 的
      # 默认样子——带 dev 组、**不带 extra**——上一步装的三个 extra 当场被卸掉，
      # 然后报 ModuleNotFoundError: docx / pydantic_ai，看起来像代码坏了
      - name: 建表
        working-directory: backend
        run: .venv/bin/alembic upgrade head

      # ⚠️ **`../tests ../eval` 不能省**（ADR-18）。这两个目录在仓库根、不在
      # `backend/` 下，所以 `ruff check .` 一行扫不到——在此之前它们从来没被
      # lint 过，而这一步一直是绿的，看起来像在管。纳入的第一次就抓到一条
      # F841：`test_eval_scoring.py` 里那道「…is contamination」算完
      # `配图串台率` 就把它扔了，同组另外两道都断言了，唯独它没有。
      #
      # ⚠️ 配置来自 `backend/pyproject.toml`，靠 ruff「本目录没配置就用 CWD 那份」
      # 的回退——所以 `working-directory` 必须是 backend
      - name: ruff
        working-directory: backend
        run: .venv/bin/ruff check . ../tests ../eval

      # `-rs` = 把跳过的用例连原因一起列出来。`-q` 只报一句「1 skipped」，
      # 而 CI 上一条**没人知道被跳过**的用例，和没有这条用例是一回事
      - name: pytest
        working-directory: backend
        run: .venv/bin/pytest -q -rs

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ⭐ 必须 24。`npm test` 是 `node --test lib/*.test.ts`，
          # 直接喂 TypeScript 给 node 跑，靠的是内置的类型擦除。
          # 22 以下不认 .ts，报的是一句看不懂的语法错误
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 装依赖
        working-directory: frontend
        run: npm ci

      - name: 单测
        working-directory: frontend
        run: npm test

      - name: lint
        working-directory: frontend
        run: npm run lint

      # ⚠️ **`next typegen` 不能省，而且必须排在 tsc 前面。**
      # `app/layout.tsx` 用的 `LayoutProps<"/">` 是 Next 16 **生成**的全局类型，
      # 住在 `.next/types/` 里，而那个目录是 gitignore 的。
      # 干净检出上直接跑 tsc，报的是一句看不懂的
      #   `error TS2304: Cannot find name 'LayoutProps'`
      #
      # ⭐ 本机一直是绿的，因为 `.next/` 还留着上一次 `npm run build` 的产物——
      # **这正是「本机绿、CI 红」的教科书形态**：本机多了一个谁都没意识到的前置条件。
      # 这一步从 2026-08-25 起就红着，只是那时 backend 也红，没人往下看第二条。
      #
      # 用 `typegen` 不用 `build`：它只生成类型、不打包，几秒钟的事，
      # 而把整个 `next build` 挪到类型检查前面会让一次类型错误要等两分钟才报出来。
      - name: 生成路由类型
        working-directory: frontend
        run: npx next typegen

      - name: 类型检查
        working-directory: frontend
        run: npx tsc --noEmit

      # 构建也在 CI 里跑一次。线上产物是本机构建后传上去的（服务器 1.6G
      # 内存跑 next build 必 OOM，见 OPERATIONS.md），所以「构建能不能过」
      # 在真正部署之前没有任何地方验过——这里是唯一的一道
      - name: 构建
        working-directory: frontend
        run: npm run build
